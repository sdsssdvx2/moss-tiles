# Deploys the paper bot when engine code changes on main. Secrets never appear in this repo:
#   secret   CLOUDFLARE_API_TOKEN  (Workers Scripts:Edit, D1:Edit, Workers AI:Read, Account Settings:Read)
#   variable CF_ACCOUNT_ID, D1_ID  (identifiers, not secrets)
# Existing Worker secrets (password, Telegram, KRX key) are kept by wrangler deploy.
name: deploy
on:
  push:
    branches: [main]
    paths: ['src/**', 'migrations/**', 'wrangler.jsonc', '.github/workflows/deploy.yml']
  workflow_dispatch: {}
permissions:
  contents: read
concurrency: { group: deploy, cancel-in-progress: false }
jobs:
  deploy:
    if: ${{ vars.CF_ACCOUNT_ID != '' && vars.D1_ID != '' }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # CLOUDFLARE_API_TOKEN is given only to the two wrangler steps below, so npm install scripts and tests never see it.
      CLOUDFLARE_ACCOUNT_ID: ${{ vars.CF_ACCOUNT_ID }}
      WRANGLER_SEND_METRICS: 'false'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: Unit tests (never deploy a red engine)
        run: npm install --no-audit --no-fund && node --test test/*.test.mjs
      - name: Build deploy config
        run: |
          sed -e 's/__D1_DATABASE_ID__/${{ vars.D1_ID }}/' -e '/"\$schema"/d' wrangler.jsonc > wrangler.deploy.jsonc
          grep -q '${{ vars.D1_ID }}' wrangler.deploy.jsonc
      - name: Apply D1 migrations
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: npx -y wrangler@4.152.0 d1 migrations apply DB --remote --config wrangler.deploy.jsonc
      - name: Deploy
        env: { CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}' }
        run: npx -y wrangler@4.152.0 deploy --config wrangler.deploy.jsonc
